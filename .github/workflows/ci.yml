name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fyne (the desktop UI) needs cgo plus OpenGL, X11 and Wayland headers:
      # its GLFW 3.4 builds both the X11 and the Wayland backend.
      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - run: go vet ./...
      - run: go test -race ./...
      - name: Kill -9 durability test
        run: go test -tags integration ./cmd/twocan-cli/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner's Android SDK is used; Gradle installs a missing platform
      # or NDK version itself. build-go.sh builds the Go core into the app.
      - name: Test, lint and build the Android app
        working-directory: android
        run: ./gradlew --console=plain testDebugUnitTest lintDebug assembleDebug
