name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fyne (the desktop UI) needs cgo plus the OpenGL/X11 headers.
      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - run: go vet ./...
      - run: go test -race ./...
      - name: Kill -9 durability test
        run: go test -tags integration ./cmd/twocan-cli/
