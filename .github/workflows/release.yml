name: Release

# Push a tag like v0.1.0 to test, build and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # The signed Android app. The key comes from two repository secrets (see
  # the README); without them the release fails rather than publish an APK
  # that phones would not install as an update.
  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      TWOCAN_BOOTSTRAP: ${{ vars.TWOCAN_BOOTSTRAP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TWOCAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$TWOCAN_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (see the README)."
            exit 1
          fi
          export TWOCAN_KEYSTORE="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$TWOCAN_KEYSTORE"
          export TWOCAN_VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --console=plain assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          mkdir -p ../dist && cp "$apk" ../dist/twocan-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/twocan-android.apk
          if-no-files-found: error

  release:
    needs: [test, android]
    # Built on an older Ubuntu so the desktop binary runs on older glibc too.
    runs-on: ubuntu-22.04
    env:
      # Repository variable (Settings → Secrets and variables → Actions → Variables):
      # comma-separated helper multiaddrs baked into the binaries as the default bootstrap.
      TWOCAN_BOOTSTRAP: ${{ vars.TWOCAN_BOOTSTRAP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist

      - name: Build
        run: |
          ldflags="-s -w -X twocan/internal/p2p.bootstrapAddrs=${TWOCAN_BOOTSTRAP}"
          mkdir -p dist
          go build -trimpath -ldflags "$ldflags" -o dist/twocan-linux-amd64 ./cmd/twocan
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/twocan-cli-linux-$arch" ./cmd/twocan-cli
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/twocan-helper-linux-$arch" ./cmd/twocan-helper
          done
          cp deploy/twocan-helper.service dist/
          cd dist && sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Twocan $GITHUB_REF_NAME" --generate-notes

  # Installs the new helper on the VPS, if VPS_HOST is set. The deploy key
  # can only run deploy/twocan-helper-update there (see the README).
  deploy-helper:
    needs: release
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the helper to the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          ssh deploy@"$VPS_HOST" "$GITHUB_REF_NAME"
