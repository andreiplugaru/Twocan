name: Release

# Push a tag like v0.1.0 to test, build and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    # Built on an older Ubuntu so the desktop binary runs on older glibc too.
    runs-on: ubuntu-22.04
    env:
      # Repository variable (Settings → Secrets and variables → Actions → Variables):
      # comma-separated helper multiaddrs baked into the binaries as the default bootstrap.
      TWOCAN_BOOTSTRAP: ${{ vars.TWOCAN_BOOTSTRAP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Build
        run: |
          ldflags="-s -w -X twocan/internal/p2p.bootstrapAddrs=${TWOCAN_BOOTSTRAP}"
          mkdir dist
          go build -trimpath -ldflags "$ldflags" -o dist/twocan-linux-amd64 ./cmd/twocan
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/twocan-cli-linux-$arch" ./cmd/twocan-cli
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/twocan-helper-linux-$arch" ./cmd/twocan-helper
          done
          cp deploy/twocan-helper.service dist/
          cd dist && sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Twocan $GITHUB_REF_NAME" --generate-notes
